<!doctype html>
<html><head><meta charset="utf-8"><title>Admin Login</title>
<script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-100 flex items-center justify-center h-screen">
<form method="post" action="/admin/login" class="bg-white p-8 rounded shadow w-80 space-y-4">
  <h1 class="text-xl font-semibold">PR Review Agent</h1>
  {% if error %}<p class="text-red-600 text-sm">{{ error }}</p>{% endif %}
  <input name="username" placeholder="username" class="border w-full p-2 rounded">
  <input name="password" type="password" placeholder="password" class="border w-full p-2 rounded">
  <button class="bg-blue-600 text-white w-full p-2 rounded">Sign in</button>
</form></body></html>
