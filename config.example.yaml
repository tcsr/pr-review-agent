bot_handle: pr-agent
llm:
  provider: claude          # claude | openai | local | fake
  model: claude-sonnet-5
  api_key: ${LLM_API_KEY}
  base_url: null            # set for local, e.g. http://localhost:11434/v1
  max_tokens_per_pr: 40000
store:
  url: sqlite:///data/agent.db
defaults:
  tasks: [triage, code_review, suggest_fixes, summarize, compliance, verdict]
rules:
  gates:
    require_linked_issue: {severity: warn}
    ci_must_pass: {severity: block}
  review_criteria:
    - "No debug prints or console.log statements."
    - "Add tests for new features."
stacks:
  auto_detect: true
  packs: {}                 # override with {angular: false} to disable
repos:
  - platform: github
    full_name: owner/repo
    token: ${GITHUB_TOKEN}
    tasks: null
    rules:                  # override global rules
      gates:
        require_pr_description: {severity: warn}
    stacks:                 # override global stacks
      packs: {angular: false}
ui:
  enabled: true
  admin_user: admin
  admin_password_hash: ${ADMIN_PASSWORD_HASH}   # generate: python -c "from app.auth import hash_password; print(hash_password('yourpassword'))"
  session_secret: ${SESSION_SECRET}
